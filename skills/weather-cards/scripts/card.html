<script>
'use strict';
const D=JSON.parse(document.getElementById('weather-data').textContent);
let unit=D.initial_unit,expanded=false,selected=null,lastSel=null;
const $=s=>document.getElementById(s),missing=v=>v===null||v===undefined;
const fmt=(ts,opts)=>new Intl.DateTimeFormat('en-US',{timeZone:D.timezone,...opts}).format(new Date(ts*1000));

const clock=ts=>fmt(ts,{hour:'numeric',minute:'2-digit'});
const degree=v=>missing(v)?'—':Math.round(unit==='F'?v*9/5+32:v)+'°';
const percent=v=>missing(v)?'—':Math.round(v)+'%';
const weatherNames={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with hail'};
function icon(code,day=true,event=null){
 let name=event||(weatherNames[code]||'Unknown conditions'),shapes='';
 const sun='<circle cx="16" cy="14" r="6" fill="#ffc65c"/><g stroke="#ffc65c" stroke-width="1.6" stroke-linecap="round"><path d="M16 3v2m0 18v2M5 14H3m26 0h-2M8 6l1.5 1.5m13 13L24 22M24 6l-1.5 1.5m-13 13L8 22"/></g>';
 const moon='<path d="M22 5a10 10 0 1 0 4 15A10 10 0 0 1 22 5" fill="#b6cbf1"/>';
 const cloud='<path d="M8 23a6 6 0 0 1-1-12 8 8 0 0 1 15-1 6.5 6.5 0 0 1 2 13Z" fill="#8397a5" stroke="#b9c7ce" stroke-width="1"/>';
 if(event){shapes='<path d="M7 22a9 9 0 0 1 18 0" fill="#ffbe64"/><g stroke="#f7ad55" stroke-width="1.5"><path d="M16 6v4M4 12l3 3m21-3-3 3M2 22h28"/></g><path d="M16 13v7m-3-4 3-3 3 3" stroke="#f8e2ae" fill="none"/>';if(event==='sunset')shapes=shapes.replace('M16 13v7m-3-4 3-3 3 3','M16 13v7m-3-3 3 3 3-3');}
 else if(code===0||code===1)shapes=missing(day)?'<text x="16" y="24" fill="#9ba6b3" text-anchor="middle">?</text>':(day?sun:moon);
 else if(code===2)shapes=(missing(day)?'':day?sun:moon)+cloud;
 else if(code===3)shapes=cloud;
 else if(code===45||code===48)shapes=cloud+'<path d="M4 26h24M7 29h18" stroke="#a4b2bd" stroke-width="1.5"/>';
 else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))shapes=cloud+'<path d="m10 26-2 4m9-4-2 4m9-4-2 4" stroke="#54b9f1" stroke-width="2" stroke-linecap="round"/>';
 else if([71,73,75,77,85,86].includes(code))shapes=cloud+'<g fill="#bde9fa"><circle cx="9" cy="28" r="1.6"/><circle cx="17" cy="27" r="1.6"/><circle cx="24" cy="29" r="1.6"/></g>';
 else if([95,96,99].includes(code))shapes=cloud+'<path d="m17 21-5 7h5l-1 4 7-8h-5l2-3Z" fill="#ffd66d"/>';
 else shapes='<text x="16" y="24" fill="#9ba6b3" text-anchor="middle">?</text>';
 return '<svg class="icon" viewBox="0 0 32 34" role="img" aria-label="'+name+'"><title>'+name+'</title>'+shapes+'</svg>';
}
function el(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function paint(){
 $('fahrenheit').setAttribute('aria-pressed',unit==='F');$('celsius').setAttribute('aria-pressed',unit==='C');
 const c=D.current,today=D.daily.find(d=>dateKey(d.time)===dateKey(D.source_time)),sel=selected===null?null:D.daily.find(d=>d.time===selected);
 if(!sel){
  $('hero').innerHTML=icon(c.weather_code,c.is_day)+'<span class="temp">'+degree(c.temperature_2m)+'</span><span class="condition">'+(weatherNames[c.weather_code]||'Unknown conditions')+'</span>';
  $('feels').textContent='Feels like '+degree(c.apparent_temperature)+' · H:'+degree(today?.temperature_2m_max)+' L:'+degree(today?.temperature_2m_min);
  $('wind').textContent='Wind '+(missing(c.wind_speed_10m)?'—':Math.round(unit==='F'?c.wind_speed_10m/1.609344:c.wind_speed_10m))+' '+(unit==='F'?'mph':'km/h')+' · Humidity '+percent(c.relative_humidity_2m);
  $('hours-label').textContent='Hourly forecast';
 }else{
  $('hero').innerHTML=icon(sel.weather_code,true)+'<span class="temp">'+degree(sel.temperature_2m_max)+'</span><span class="condition">'+(weatherNames[sel.weather_code]||'Unknown conditions')+'</span>';
  $('feels').textContent=fmt(sel.time,{weekday:'long'})+' · H:'+degree(sel.temperature_2m_max)+' L:'+degree(sel.temperature_2m_min);
  $('wind').textContent='Chance of precipitation '+percent(sel.precipitation_probability_max);
  $('hours-label').textContent=fmt(sel.time,{weekday:'long'});
 }
 const previousScroll=$('hours').scrollLeft;$('hours').replaceChildren();
 const key=sel?dateKey(sel.time):null,evs=sel?[...D.hourly.filter(h=>dateKey(h.time)===key).map(h=>({...h,kind:'hour'})),...['sunrise','sunset'].filter(k=>!missing(sel[k])).map(k=>({time:sel[k],kind:k}))].sort((x,y)=>x.time-y.time):D.events;
 if(sel&&!evs.length)$('hours').append(el('div','detail','Hourly forecast unavailable for this day'));
 for(const h of evs){
  const sun=['sunrise','sunset'].includes(h.kind),node=el('div','hour'+(sun?' sun':''));node.dataset.time=h.time;node.dataset.kind=h.kind;
  node.append(el('div','hour-time',h.kind==='now'?'Now':sun?clock(h.time):fmt(h.time,{hour:'numeric'})));
  let art=el('div');art.innerHTML=icon(h.weather_code,h.is_day,sun?h.kind:null);node.append(art);
  node.append(el('div','pop',sun?'':percent(h.precipitation_probability)));
  node.append(el('div','hour-temp',sun?(h.kind==='sunrise'?'Sunrise':'Sunset'):degree(h.temperature_2m)));$('hours').append(node);
 }
 $('hours').scrollLeft=sel===lastSel?previousScroll:0;lastSel=sel;requestAnimationFrame(()=>$('hours').dispatchEvent(new Event('scroll')));
 $('days').replaceChildren();
 const values=D.daily.flatMap(d=>[d.temperature_2m_min,d.temperature_2m_max]).filter(v=>!missing(v)),lo=Math.min(...values),hi=Math.max(...values);
 for(const d of D.daily.slice(0,expanded?14:5)){
  const isToday=dateKey(d.time)===dateKey(D.source_time),isSel=selected===null?isToday:d.time===selected,row=el('button','day'+(isToday?' today':'')+(isSel?' selected':''));row.type='button';row.setAttribute('aria-pressed',isSel);row.setAttribute('aria-label',(isToday?'Today':fmt(d.time,{weekday:'long'}))+' forecast');row.onclick=()=>{selected=isToday?null:d.time;paint();};
  row.append(el('div','day-name',isToday?'Today':fmt(d.time,{weekday:'short'})));
  const w=el('div','daily-weather');w.innerHTML=icon(d.weather_code,true);w.append(el('div','pop',percent(d.precipitation_probability_max)));row.append(w);
  row.append(el('div','low',degree(d.temperature_2m_min)));
  const track=el('div','track');track.setAttribute('aria-hidden','true');
  if(!missing(d.temperature_2m_min)&&!missing(d.temperature_2m_max)){
   const bar=el('div','range'),span=hi-lo;
   bar.style.left=(span?(d.temperature_2m_min-lo)/span*100:0)+'%';bar.style.width=(span?(d.temperature_2m_max-d.temperature_2m_min)/span*100:100)+'%';track.append(bar);
  }row.append(track,el('div','high',degree(d.temperature_2m_max)));$('days').append(row);
 }
 if(!D.daily.length)$('days').append(el('div','detail','Daily forecast unavailable'));
 $('more').hidden=D.daily.length<=5;$('more').setAttribute('aria-expanded',expanded);$('more').innerHTML='<span>'+(expanded?'Show less':'Show more')+'</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>';
}
try{
 $('city').textContent=D.city;
 const rt=D.retrieved_at?Date.parse(D.retrieved_at):NaN,clockMs=ms=>new Intl.DateTimeFormat('en-US',{timeZone:D.timezone,hour:'numeric',minute:'2-digit'}).format(ms),dayMs=ms=>new Intl.DateTimeFormat('en-US',{timeZone:D.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).format(ms);
 if(Number.isFinite(rt)){$('valid').textContent='Updated '+clockMs(rt)+(dayMs(rt)!==dayMs(Date.now())?' · '+new Intl.DateTimeFormat('en-US',{timeZone:D.timezone,month:'short',day:'numeric'}).format(rt):'');$('valid').title='Fetched from Open-Meteo at this time ('+D.timezone+'). Static snapshot; it does not refresh.';}
 else{$('valid').textContent='Valid '+clock(D.source_time)+' · '+fmt(D.source_time,{month:'short',day:'numeric'});$('valid').title='Forecast valid time; fetch time unavailable. Static snapshot.';}
 const hs=$('hours'),updateNav=()=>{$('hours-prev').hidden=hs.scrollLeft<4;$('hours-next').hidden=hs.scrollLeft+hs.clientWidth>=hs.scrollWidth-4};$('hours-prev').onclick=()=>hs.scrollBy({left:-Math.max(120,hs.clientWidth*.75),behavior:'smooth'});$('hours-next').onclick=()=>hs.scrollBy({left:Math.max(120,hs.clientWidth*.75),behavior:'smooth'});hs.addEventListener('scroll',updateNav,{passive:true});addEventListener('resize',updateNav);requestAnimationFrame(updateNav);
 $('fahrenheit').onclick=()=>{unit='F';paint();};$('celsius').onclick=()=>{unit='C';paint();};$('more').onclick=()=>{expanded=!expanded;if(!expanded&&selected!==null&&D.daily.findIndex(d=>d.time===selected)>=5)selected=null;paint();};paint();
}catch(e){document.querySelector('main').replaceChildren(el('div','error','Weather unavailable: invalid forecast timezone or data. No previous forecast substituted.'));}
</script><script>
// Hermes inline previews start at a fixed height and do not shrink on their own. Report the card's real
// height to the host frame so Show more, day selection and resizes never clip or leave a gap.
// Outside a Hermes preview there is no host token, so this does nothing.
(function(){
function tok(){for(const s of document.scripts){const m=/var t=("[^"]+")/.exec(s.textContent||'');if(m&&/hermes-inline-preview-size/.test(s.textContent))return JSON.parse(m[1]);}return null}
function fit(){const t=tok(),el=document.querySelector('.card');if(!t||!el)return;const h=Math.ceil(el.getBoundingClientRect().bottom+scrollY+2);if(Math.abs(innerHeight-Math.max(120,h))>2)parent.postMessage({type:'hermes-inline-preview-size',token:t,height:h},'*')}
addEventListener('load',()=>{fit();[100,300,700,1500].forEach(ms=>setTimeout(fit,ms))});addEventListener('resize',()=>setTimeout(fit,50));
document.addEventListener('click',()=>{requestAnimationFrame(fit);setTimeout(fit,250)},true);
if(window.ResizeObserver){const ro=new ResizeObserver(()=>fit());const go=()=>{const el=document.querySelector('.card');el&&ro.observe(el)};document.readyState==='loading'?addEventListener('DOMContentLoaded',go):go()}
})()</script></body></html>
